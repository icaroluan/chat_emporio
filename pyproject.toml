[project]
name = "desafio-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Icaro", email = "icarolf2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.34.0",
    "onnxruntime>=1.31.1",
    "psycopg[binary]>=3.3.6",
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
    "python-dotenv>=1.2.4",
    "rapidocr>=3.10.0",
]

[project.scripts]
desafio-ai = "desafio_ai:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
