# Coloque estes quatro arquivos na mesma pasta.
# Copie .env.example para .env, ajuste os valores e execute: docker compose up -d
# Os scripts SQL executam em ordem apenas na primeira inicialização de um volume vazio.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emporio}
      POSTGRES_USER: ${POSTGRES_USER:-emporio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data

    - type: bind
      source: ../sqls/01_schema.sql
      target: /docker-entrypoint-initdb.d/01_schema.sql
      read_only: true
      bind:
        create_host_path: false

    - type: bind
      source: ../sqls/02_seed.sql
      target: /docker-entrypoint-initdb.d/02_seed.sql
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
